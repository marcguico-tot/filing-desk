<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filing Desk</title>
<meta name="description" content="Workflow tool for preparing, sending, and tracking PACT/Excise reporting deliverables to clients.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#f4f5f8;
    --surface:#ffffff;
    --surface-2:#eceff4;
    --surface-3:#e2e6ee;
    --border:#d7dbe4;
    --border-strong:#c1c7d4;
    --ink:#161a23;
    --ink-muted:#5b6472;
    --ink-faint:#8890a0;
    --accent:#2c3a8f;
    --accent-strong:#212c72;
    --accent-ink:#ffffff;
    --accent-soft:#e7e9fb;
    --good:#177a4c;
    --good-soft:#e1f3e9;
    --warn:#a5680a;
    --warn-soft:#faedd6;
    --bad:#b1281f;
    --bad-soft:#fbe3e1;
    --shadow:0 1px 2px rgba(22,26,35,.06), 0 8px 24px -12px rgba(22,26,35,.22);
    --radius:10px;
    --radius-sm:7px;
    --font-display:'Public Sans',system-ui,-apple-system,sans-serif;
    --font-body:'Public Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0e13;
      --surface:#151821;
      --surface-2:#1b1f2a;
      --surface-3:#232837;
      --border:#2b3140;
      --border-strong:#3a4152;
      --ink:#e8eaf0;
      --ink-muted:#9aa2b3;
      --ink-faint:#6c7484;
      --accent:#8c96ff;
      --accent-strong:#a5aeff;
      --accent-ink:#0c0e13;
      --accent-soft:#232a55;
      --good:#4bce93;
      --good-soft:#123526;
      --warn:#e7ac4c;
      --warn-soft:#3c2c11;
      --bad:#f0736a;
      --bad-soft:#3c1a17;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0e13;
    --surface:#151821;
    --surface-2:#1b1f2a;
    --surface-3:#232837;
    --border:#2b3140;
    --border-strong:#3a4152;
    --ink:#e8eaf0;
    --ink-muted:#9aa2b3;
    --ink-faint:#6c7484;
    --accent:#8c96ff;
    --accent-strong:#a5aeff;
    --accent-ink:#0c0e13;
    --accent-soft:#232a55;
    --good:#4bce93;
    --good-soft:#123526;
    --warn:#e7ac4c;
    --warn-soft:#3c2c11;
    --bad:#f0736a;
    --bad-soft:#3c1a17;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  html{ color-scheme: light dark; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:1180px; margin:0 auto; padding:28px 24px 80px; }

  a{ color:var(--accent); }
  h1,h2,h3{ font-family:var(--font-display); font-weight:800; letter-spacing:-.01em; text-wrap:balance; margin:0; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* ---------- topbar ---------- */
  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding-bottom:22px; border-bottom:1px solid var(--border); margin-bottom:22px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:38px; height:38px; border-radius:9px; background:linear-gradient(155deg,var(--accent),var(--accent-strong)); display:flex; align-items:center; justify-content:center; color:var(--accent-ink); font-family:var(--font-mono); font-weight:600; font-size:15px; flex:none; }
  .brand-text h1{ font-size:21px; }
  .brand-text p{ margin:2px 0 0; font-size:12.5px; color:var(--ink-muted); }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .badge{ font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px; letter-spacing:.02em; cursor:default; border:none; font-family:inherit; }
  .badge-readonly{ background:var(--warn-soft); color:var(--warn); }
  .badge-demo{ background:var(--surface-3); color:var(--ink-muted); }
  .badge-connected{ background:var(--good-soft); color:var(--good); }
  .badge-btn{ cursor:pointer; }
  .badge-btn:hover{ filter:brightness(0.95); }
  .icon-btn{ appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-muted); width:32px; height:32px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .icon-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }

  /* ---------- tabs ---------- */
  .tabs{ display:inline-flex; padding:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:11px; margin-bottom:20px; gap:2px; }
  .tab{ appearance:none; border:none; background:transparent; padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; display:flex; align-items:center; gap:8px; }
  .tab[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .tab .count{ font-family:var(--font-mono); font-size:11px; background:var(--bad-soft); color:var(--bad); padding:1px 6px; border-radius:999px; }

  /* ---------- card / sections ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .section{ padding:22px 24px; border-bottom:1px solid var(--border); }
  .section:last-child{ border-bottom:none; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .section-head h2{ font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-weight:700; }
  .section-head .hint{ font-size:12.5px; color:var(--ink-faint); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3{ display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:16px; }
  @media (max-width:720px){ .grid2,.grid3{ grid-template-columns:1fr; } }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink-muted); }
  .field .req{ color:var(--bad); }
  .input,.select,textarea.input{
    appearance:none; width:100%; padding:9px 11px; border-radius:var(--radius-sm);
    border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:14px;
  }
  textarea.input{ resize:vertical; line-height:1.5; }
  .input:disabled,.select:disabled{ opacity:.55; cursor:not-allowed; }
  .select{ background-image:linear-gradient(45deg,transparent 50%,var(--ink-muted) 50%),linear-gradient(135deg,var(--ink-muted) 50%,transparent 50%); background-position:calc(100% - 18px) 14px,calc(100% - 13px) 14px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:32px; }
  .error-text{ font-size:12px; color:var(--bad); }
  .help-text{ font-size:12px; color:var(--ink-faint); }

  .type-check-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .type-check{ position:relative; }
  .type-check input{ position:absolute; opacity:0; inset:0; cursor:pointer; }
  .type-check span{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-strong); background:var(--surface); padding:9px 14px; border-radius:999px; font-size:13px; font-weight:600; color:var(--ink-muted); }
  .type-check input:checked + span{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
  .type-check input:disabled + span{ opacity:.4; text-decoration:line-through; cursor:not-allowed; }
  .type-check input:focus-visible + span{ outline:2px solid var(--accent); outline-offset:2px; }

  .chiprow-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .chip-count{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-muted); }
  .link-btn{ appearance:none; background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; padding:0; }
  .chiprow{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip-check{ position:relative; }
  .chip-check input{ position:absolute; opacity:0; inset:0; cursor:pointer; }
  .chip-check span{
    display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:8px; border:1px solid var(--border-strong);
    font-family:var(--font-mono); font-size:12.5px; font-weight:600; color:var(--ink-muted); background:var(--surface);
  }
  .chip-check input:checked + span{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chip-check input:focus-visible + span{ outline:2px solid var(--accent); outline-offset:2px; }
  .type-block{ margin-bottom:18px; }
  .type-block:last-child{ margin-bottom:0; }
  .type-block-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .type-block-title{ font-size:12.5px; font-weight:700; color:var(--ink); }
  .empty-note{ font-size:13px; color:var(--ink-faint); font-style:italic; }

  /* ---------- deliverable preview (screenshot-friendly) ---------- */
  .preview-card{ border:1px dashed var(--border-strong); border-radius:var(--radius); overflow:hidden; background:var(--surface); }
  .preview-toolbar{ display:flex; align-items:center; justify-content:space-between; padding:9px 14px; background:var(--surface-2); border-bottom:1px dashed var(--border-strong); }
  .preview-toolbar span{ font-size:11.5px; color:var(--ink-faint); font-weight:600; }
  .preview-inner{ padding:18px 20px; }
  .preview-title{ text-align:center; background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:13px; letter-spacing:.04em; text-transform:uppercase; padding:8px; border-radius:6px; margin-bottom:14px; }
  .preview-meta{ display:flex; justify-content:center; gap:22px; margin-bottom:16px; font-size:12.5px; }
  .preview-meta div{ text-align:center; }
  .preview-meta .k{ color:var(--ink-faint); text-transform:uppercase; font-size:10.5px; letter-spacing:.05em; }
  .preview-meta .v{ font-weight:700; font-family:var(--font-mono); }
  .preview-section-title{ background:var(--accent-soft); color:var(--accent-strong); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; text-align:center; padding:6px; border-radius:5px; margin:14px 0 8px; }
  .preview-chips{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; }
  .preview-chip{ font-family:var(--font-mono); font-size:11.5px; font-weight:700; padding:4px 8px; border-radius:6px; border:1px solid var(--border-strong); color:var(--ink-faint); background:var(--surface-2); }
  .preview-chip.on{ background:var(--good-soft); border-color:var(--good); color:var(--good); }

  .attach-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .attach-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); }
  .attach-item .ic{ width:28px; height:28px; border-radius:7px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
  .attach-item .meta{ flex:1; min-width:0; }
  .attach-item .name{ font-size:13.5px; font-weight:600; }
  .attach-item .link{ font-size:12px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .attach-item button{ appearance:none; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:16px; line-height:1; padding:4px; }
  .attach-item button:hover{ color:var(--bad); }
  .attach-add{ display:flex; gap:8px; flex-wrap:wrap; }
  .attach-add .input{ flex:1; min-width:160px; }

  /* ---------- buttons ---------- */
  .btn{ appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:var(--radius-sm); cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-muted); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--border-strong); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }
  .btn-block{ width:100%; justify-content:center; }

  /* ---------- footer bar ---------- */
  .send-footer{ position:sticky; bottom:16px; margin-top:18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .send-footer .issues{ font-size:12.5px; color:var(--warn); display:flex; align-items:center; gap:6px; }
  .send-footer .issues.ok{ color:var(--good); }
  .send-footer .actions{ display:flex; gap:10px; }

  /* ---------- stats ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  @media (max-width:820px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .stat .num{ font-family:var(--font-mono); font-size:26px; font-weight:600; line-height:1; }
  .stat .lbl{ margin-top:6px; font-size:12.5px; color:var(--ink-muted); }
  .stat.attn .num{ color:var(--bad); }

  /* ---------- filters ---------- */
  .filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .pillset{ display:inline-flex; gap:6px; flex-wrap:wrap; }
  .pill-filter{ appearance:none; border:1px solid var(--border-strong); background:var(--surface); padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; }
  .pill-filter[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .filters .input,.filters .select{ width:auto; min-width:150px; }
  .search{ flex:1; min-width:180px; }

  /* ---------- table ---------- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); }
  table{ width:100%; border-collapse:collapse; min-width:800px; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700; padding:12px 16px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody td{ padding:13px 16px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  .row-client{ font-weight:700; }
  .row-sub{ display:block; font-size:11.5px; color:var(--ink-faint); font-weight:400; margin-top:1px; }
  .row-btn{ appearance:none; background:none; border:none; padding:0; text-align:left; cursor:pointer; color:inherit; font:inherit; }
  .row-btn:hover .row-client{ color:var(--accent); }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; }
  .pill::before{ content:''; width:6px; height:6px; border-radius:999px; background:currentColor; }
  .pill-draft{ background:var(--warn-soft); color:var(--warn); }
  .pill-sent{ background:var(--good-soft); color:var(--good); }
  .pill-failed{ background:var(--bad-soft); color:var(--bad); }

  .empty-state{ text-align:center; padding:56px 20px; color:var(--ink-faint); }
  .empty-state .big{ font-size:32px; margin-bottom:8px; }

  /* ---------- modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(10,12,18,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:40; overflow-y:auto; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); max-width:480px; width:100%; max-height:86vh; overflow-y:auto; margin:auto; }
  .modal-head{ padding:20px 22px 4px; }
  .modal-head h3{ font-size:17px; }
  .modal-body{ padding:14px 22px 6px; display:flex; flex-direction:column; gap:10px; }
  .modal-row{ display:flex; justify-content:space-between; gap:14px; font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--border); }
  .modal-row:last-child{ border-bottom:none; }
  .modal-row .k{ color:var(--ink-muted); flex:none; }
  .modal-row .v{ text-align:right; font-weight:600; }
  .modal-foot{ padding:16px 22px 22px; display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
  .modal-note{ font-size:12.5px; color:var(--ink-faint); background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px; }

  /* ---------- banner / toast ---------- */
  .banner{ display:flex; align-items:center; gap:10px; padding:11px 16px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600; margin-bottom:16px; }
  .banner-good{ background:var(--good-soft); color:var(--good); }
  .banner-bad{ background:var(--bad-soft); color:var(--bad); }
  .banner-info{ background:var(--accent-soft); color:var(--accent-strong); }
  .banner button{ margin-left:auto; appearance:none; background:none; border:none; color:inherit; cursor:pointer; font-weight:700; opacity:.65; }
  .banner button:hover{ opacity:1; }

  .settings-status{ display:flex; align-items:center; gap:8px; font-size:13px; padding:9px 12px; border-radius:var(--radius-sm); background:var(--surface-2); margin-bottom:4px; }
  .dot{ width:8px; height:8px; border-radius:999px; flex:none; }
  .dot-good{ background:var(--good); }
  .dot-bad{ background:var(--bad); }
  .dot-idle{ background:var(--ink-faint); }

<div id="app"></div>
<script id="app-script">
(function(){
  "use strict";

  var TYPE_ORDER = ["pact_pa2","pact_state","excise"];
  var TYPE_LABELS = { pact_pa2:"PACT — PA-2", pact_state:"PACT — State Specific", excise:"Excise" };
  var STATUS_LABELS = { draft:"Draft", sent:"Sent", failed:"Failed" };
  var TOAST_KEY = "filingdesk_pending_toast_v1";
  var SETTINGS_KEY = "filingdesk_sheets_settings_v1";

  var HAS_RUNTIME = !!(window.claude && window.claude.use);

  var STATE = JSON.parse(document.getElementById("state-data").textContent);
  var SEED_STATE = JSON.parse(JSON.stringify(STATE));

  var SETTINGS = { url:"", token:"" };
  try{
    var raw = localStorage.getItem(SETTINGS_KEY);
    if(raw){ var parsed = JSON.parse(raw); SETTINGS.url = parsed.url || ""; SETTINGS.token = parsed.token || ""; }
  }catch(e){}

  var pendingToast = null;
  try{
    var stashed = sessionStorage.getItem(TOAST_KEY);
    if(stashed){ pendingToast = JSON.parse(stashed); sessionStorage.removeItem(TOAST_KEY); }
  }catch(e){}

  var VIEW = {
    tab: "send",
    readOnly: false,
    demoMode: !HAS_RUNTIME,
    sheetsConnected: false,
    sheetsSyncing: false,
    sheetsError: "",
    freescoutEnabled: false,
    saving: false,
    banner: pendingToast,
    filterStatus: "all",
    filterClient: "",
    search: "",
    confirmModal: null,
    detailModal: null,
    settingsOpen: false,
    settingsDraft: { url: SETTINGS.url, token: SETTINGS.token },
    form: blankForm()
  };

  function blankForm(){
    return {
      editingId: null,
      clientId: "",
      period: defaultPeriod(),
      selectedTypes: {},
      typeJurisdictions: {},
      message: "",
      messageAuto: "",
      attachments: [],
      attachName: "",
      attachLink: "",
      recipientName: "",
      recipientEmails: "",
      touched: false
    };
  }

  function defaultPeriod(){
    var now = new Date();
    var m = now.getMonth() + 1;
    var y = now.getFullYear();
    return y + "-" + (m < 10 ? "0" + m : "" + m);
  }

  function uid(){
    return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function el(tag, props, children){
    var node = document.createElement(tag);
    if(props){
      for(var k in props){
        if(!Object.prototype.hasOwnProperty.call(props, k)) continue;
        var v = props[k];
        if(v === false || v === null || v === undefined) continue;
        if(k === "class"){ node.className = v; }
        else if(k === "html"){ node.innerHTML = v; }
        else if(k.indexOf("on") === 0 && typeof v === "function"){ node.addEventListener(k.slice(2), v); }
        else if(k === "checked" || k === "disabled" || k === "value" || k === "type" || k === "for"){ node[k] = v; }
        else { node.setAttribute(k, v); }
      }
    }
    (children || []).forEach(function(c){
      if(c === null || c === undefined) return;
      if(typeof c === "string" || typeof c === "number"){ node.appendChild(document.createTextNode(String(c))); }
      else { node.appendChild(c); }
    });
    return node;
  }

  function clientById(id){
    for(var i=0;i<STATE.clients.length;i++){ if(STATE.clients[i].id === id) return STATE.clients[i]; }
    return null;
  }

  function fmtPeriod(period){
    if(!period) return "—";
    var parts = period.split("-");
    var d = new Date(Date.UTC(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1));
    return d.toLocaleString("en-US", { month:"long", year:"numeric", timeZone:"UTC" });
  }

  function fmtDateTime(iso){
    if(!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleString("en-US", { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
  }

  function validEmail(s){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
  }

  function parseEmails(s){
    return s.split(",").map(function(x){ return x.trim(); }).filter(Boolean);
  }

  function copyText(text, btn){
    function flash(ok){
      var f = VIEW.form;
      f.copyFeedback = ok ? "ok" : "fail";
      render();
      setTimeout(function(){ f.copyFeedback = false; render(); }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ flash(true); }).catch(function(){ flash(false); });
      return;
    }
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      flash(ok);
    }catch(e){ flash(false); }
  }

  function includedTypeKeys(f){
    return TYPE_ORDER.filter(function(t){ return f.selectedTypes[t]; });
  }

  function totalJurisdictionCount(f){
    var n = 0;
    includedTypeKeys(f).forEach(function(t){ n += (f.typeJurisdictions[t] || []).length; });
    return n;
  }

  function autoMessage(client, f){
    if(!client) return "";
    var typeNames = includedTypeKeys(f).map(function(t){ return TYPE_LABELS[t]; });
    var typesText = typeNames.length ? typeNames.join(", ") : "filing";
    var name = f.recipientName || (client.defaultRecipient && client.defaultRecipient.name) || "team";
    return "Hi " + name + " — attached is the " + typesText + " filing status for " + fmtPeriod(f.period) + ".\n\nLet us know if anything looks off.\n\nThanks,\nMarc";
  }

  /* ---------------- google sheets sync ---------------- */

  function saveSettings(){
    try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); }catch(e){}
  }

  function syncFromSheets(showBanner){
    if(!SETTINGS.url) return;
    VIEW.sheetsSyncing = true;
    VIEW.sheetsError = "";
    render();
    fetch(SETTINGS.url + (SETTINGS.url.indexOf("?") === -1 ? "?" : "&") + "action=config")
      .then(function(r){ return r.json(); })
      .then(function(data){
        VIEW.sheetsSyncing = false;
        if(!data || !data.ok){
          VIEW.sheetsConnected = false;
          VIEW.sheetsError = (data && data.error) || "Unexpected response from the script.";
          render();
          return;
        }
        if(data.clients && data.clients.length){ STATE.clients = data.clients; }
        if(data.log){ STATE.deliverables = data.log.slice().reverse(); }
        VIEW.sheetsConnected = true;
        VIEW.freescoutEnabled = !!data.freescoutEnabled;
        if(showBanner){ VIEW.banner = { type:"good", text:"Synced with Google Sheets — " + STATE.clients.length + " clients, " + STATE.deliverables.length + " logged deliverables." }; }
        render();
      })
      .catch(function(err){
        VIEW.sheetsSyncing = false;
        VIEW.sheetsConnected = false;
        VIEW.sheetsError = "Could not reach that URL (" + err.message + "). Check the Web app URL and that it's deployed with “Anyone” access.";
        render();
      });
  }

  function logToSheets(record){
    return fetch(SETTINGS.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: SETTINGS.token, action:"log", record: record })
    }).then(function(r){ return r.json(); });
  }

  function draftToFreeScout(record){
    return fetch(SETTINGS.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: SETTINGS.token, action:"freescoutDraft", record: record })
    }).then(function(r){ return r.json(); });
  }

  /* ---------------- persistence ---------------- */

  function fullDocument(state){
    var styleText = document.getElementById("app-style").textContent;
    var scriptText = document.getElementById("app-script").textContent;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var head = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Filing Desk</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style id=\"app-style\">" + styleText + "</style>\n</head>\n<body>\n";
    var body = "<script type=\"application/json\" id=\"state-data\">" + json + "<" + "/script>\n<div id=\"app\"></div>\n<script id=\"app-script\">" + scriptText + "<" + "/script>\n</body>\n</html>";
    return head + body;
  }

  function persist(newState, toast, record){
    STATE = newState;

    if(HAS_RUNTIME){
      if(toast){ try{ sessionStorage.setItem(TOAST_KEY, JSON.stringify(toast)); }catch(e){} }
      VIEW.saving = true;
      render();
      window.claude.use("artifact").then(function(ns){
        if(!ns){
          VIEW.saving = false;
          if(toast){ VIEW.banner = { type:"info", text:"Preview mode — changes are shown here but not saved. Open the published artifact to save for real." }; try{ sessionStorage.removeItem(TOAST_KEY); }catch(e){} }
          render();
          return;
        }
        return ns.publish(fullDocument(newState)).catch(function(err){
          VIEW.saving = false;
          if(err && err.code === "conflict"){ return; }
          if(err && (err.code === "not_writer" || err.code === "not_granted")){
            VIEW.readOnly = true;
            VIEW.banner = { type:"info", text:"You're viewing Filing Desk in read-only mode — changes made here aren't saved." };
          } else {
            VIEW.banner = { type:"bad", text:"Couldn't save that change" + (err && err.message ? (": " + err.message) : ".") + " Please try again." };
          }
          try{ sessionStorage.removeItem(TOAST_KEY); }catch(e){}
          render();
        });
      }).catch(function(){ VIEW.saving = false; render(); });
      return;
    }

    if(SETTINGS.url && SETTINGS.token && record){
      VIEW.saving = true;
      render();
      logToSheets(record).then(function(res){
        VIEW.saving = false;
        if(res && res.ok){
          if(toast) VIEW.banner = toast;
          syncFromSheets(false);
        } else {
          VIEW.banner = { type:"bad", text:"Google Sheets rejected that write" + (res && res.error ? (": " + res.error) : "") + ". The change is kept here locally — fix the issue and try again." };
          render();
        }
      }).catch(function(err){
        VIEW.saving = false;
        VIEW.banner = { type:"bad", text:"Couldn't reach Google Sheets (" + err.message + "). The change is kept here locally — it will need to be re-sent once the connection is back." };
        render();
      });
      return;
    }

    if(toast){ VIEW.banner = toast; }
    render();
  }

  /* ---------------- render ---------------- */

  function render(){
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(renderTopbar());
    if(VIEW.banner){ app.appendChild(renderBanner()); }
    app.appendChild(renderTabs());
    if(VIEW.tab === "send"){ app.appendChild(renderSendTab()); }
    else { app.appendChild(renderTrackerTab()); }
    if(VIEW.confirmModal){ app.appendChild(renderConfirmModal()); }
    if(VIEW.detailModal){ app.appendChild(renderDetailModal()); }
    if(VIEW.settingsOpen){ app.appendChild(renderSettingsModal()); }
  }

  function renderTopbar(){
    var right = [];
    if(!HAS_RUNTIME){
      if(VIEW.sheetsConnected){
        right.push(el("button",{class:"badge badge-connected badge-btn", onclick:function(){ VIEW.settingsOpen = true; render(); }},["✓ Connected to Sheets"]));
      } else if(VIEW.demoMode){
        right.push(el("button",{class:"badge badge-demo badge-btn", title:"Click to connect this build to a Google Sheet.", onclick:function(){ VIEW.settingsOpen = true; render(); }},["Demo mode — not saved"]));
      }
      right.push(el("button",{class:"icon-btn", title:"Settings", "aria-label":"Settings", onclick:function(){ VIEW.settingsOpen = true; render(); }},["⚙"]));
    }
    if(VIEW.readOnly){ right.push(el("span",{class:"badge badge-readonly"},["Read-only"])); }
    return el("div",{class:"topbar"},[
      el("div",{class:"brand"},[
        el("div",{class:"brand-mark"},["FD"]),
        el("div",{class:"brand-text"},[
          el("h1",{},["Filing Desk"]),
          el("p",{},["Token of Trust — PACT & Excise reporting deliverables"])
        ])
      ]),
      el("div",{class:"topbar-right"}, right)
    ]);
  }

  function renderBanner(){
    var b = VIEW.banner;
    var cls = "banner banner-" + (b.type === "bad" ? "bad" : b.type === "info" ? "info" : "good");
    return el("div",{class:cls},[
      el("span",{},[b.text]),
      el("button",{"aria-label":"Dismiss", onclick:function(){ VIEW.banner = null; render(); }},["×"])
    ]);
  }

  function renderTabs(){
    var needsAttention = STATE.deliverables.filter(function(d){ return d.status === "failed"; }).length;
    return el("div",{class:"tabs", role:"tablist"},[
      el("button",{class:"tab", role:"tab","aria-selected": VIEW.tab==="send", onclick:function(){ VIEW.tab = "send"; render(); }},["Send a deliverable"]),
      el("button",{class:"tab", role:"tab","aria-selected": VIEW.tab==="tracker", onclick:function(){ VIEW.tab = "tracker"; render(); }},[
        "Tracker",
        needsAttention > 0 ? el("span",{class:"count"},[String(needsAttention)]) : null
      ])
    ]);
  }

  /* ---------------- settings modal ---------------- */

  function renderSettingsModal(){
    var d = VIEW.settingsDraft;
    var status;
    if(VIEW.sheetsSyncing){ status = el("div",{class:"settings-status"},[el("span",{class:"dot dot-idle"}),"Connecting…"]); }
    else if(VIEW.sheetsConnected){ status = el("div",{class:"settings-status"},[el("span",{class:"dot dot-good"}),"Connected — " + STATE.clients.length + " clients synced."]); }
    else if(VIEW.sheetsError){ status = el("div",{class:"settings-status"},[el("span",{class:"dot dot-bad"}),VIEW.sheetsError]); }
    else { status = el("div",{class:"settings-status"},[el("span",{class:"dot dot-idle"}),"Not connected — showing built-in sample data."]); }

    return el("div",{class:"overlay", onclick:function(e){ if(e.target === e.currentTarget){ VIEW.settingsOpen = false; render(); } }},[
      el("div",{class:"modal"},[
        el("div",{class:"modal-head"},[ el("h3",{},["Connect to Google Sheets"]) ]),
        el("div",{class:"modal-body"},[
          el("p",{class:"help-text"},["Paste the Web app URL and token from the Filing Desk Apps Script deployment (see Code.gs for setup steps)."]),
          el("div",{class:"field"},[ el("label",{},["Web app URL"]),
            el("input",{class:"input", placeholder:"https://script.google.com/macros/s/…/exec", value:d.url, oninput:function(e){ d.url = e.target.value; }})
          ]),
          el("div",{class:"field"},[ el("label",{},["Token (FD_TOKEN)"]),
            el("input",{class:"input", type:"password", placeholder:"the value you set as FD_TOKEN", value:d.token, oninput:function(e){ d.token = e.target.value; }})
          ]),
          status
        ]),
        el("div",{class:"modal-foot"},[
          SETTINGS.url ? el("button",{class:"btn btn-ghost", onclick:function(){
            SETTINGS = { url:"", token:"" }; saveSettings();
            STATE = JSON.parse(JSON.stringify(SEED_STATE));
            VIEW.sheetsConnected = false; VIEW.sheetsError = ""; VIEW.settingsDraft = { url:"", token:"" };
            VIEW.banner = { type:"info", text:"Disconnected — back to built-in sample data." };
            render();
          }},["Disconnect"]) : null,
          el("button",{class:"btn btn-ghost", onclick:function(){ VIEW.settingsOpen = false; render(); }},["Close"]),
          el("button",{class:"btn btn-primary", onclick:function(){
            SETTINGS.url = d.url.trim(); SETTINGS.token = d.token.trim();
            saveSettings();
            syncFromSheets(true);
          }},["Save & connect"])
        ])
      ])
    ]);
  }

  /* ---------------- send tab ---------------- */

  function renderSendTab(){
    var f = VIEW.form;
    var client = clientById(f.clientId);
    var errors = validate(f, false);

    var wrap = el("div",{},[]);
    wrap.appendChild(renderClientSection(f, client));
    if(client && includedTypeKeys(f).length >= 0 && Object.keys(client.types).length){
      wrap.appendChild(renderJurisdictionSection(f, client));
      wrap.appendChild(renderPreviewSection(f, client));
      wrap.appendChild(renderAttachmentSection(f));
      wrap.appendChild(renderRecipientSection(f));
    }
    wrap.appendChild(renderSendFooter(f, errors));
    return wrap;
  }

  function selectClient(f, client){
    f.clientId = client ? client.id : "";
    f.selectedTypes = {};
    f.typeJurisdictions = {};
    if(client){
      TYPE_ORDER.forEach(function(t){
        if(client.types[t]){
          f.selectedTypes[t] = true;
          f.typeJurisdictions[t] = client.types[t].states.slice();
        }
      });
      if(!f.recipientName && client.defaultRecipient && client.defaultRecipient.name){ f.recipientName = client.defaultRecipient.name; }
      if(!f.recipientEmails && client.defaultRecipient && client.defaultRecipient.emails && client.defaultRecipient.emails.length){ f.recipientEmails = client.defaultRecipient.emails.join(", "); }
    }
    refreshAutoMessage(f, client);
  }

  function refreshAutoMessage(f, client){
    var next = autoMessage(client, f);
    if(!f.message || f.message === f.messageAuto){ f.message = next; }
    f.messageAuto = next;
  }

  function renderClientSection(f, client){
    var clientSelect = el("select",{class:"select", onchange:function(e){
      selectClient(f, clientById(e.target.value));
      render();
    }}, [ el("option",{value:""},["Select a client…"]) ].concat(STATE.clients.map(function(c){
      var o = el("option",{value:c.id},[c.domain + "  ·  " + c.ref]);
      if(c.id === f.clientId) o.selected = true;
      return o;
    })));

    var typeButtons = TYPE_ORDER.map(function(t){
      var available = client && client.types[t];
      var checked = !!f.selectedTypes[t];
      return el("label",{class:"type-check"},[
        el("input",{type:"checkbox", disabled: !available, checked: checked, onchange:function(e){
          f.selectedTypes[t] = e.target.checked;
          if(e.target.checked && !f.typeJurisdictions[t]){ f.typeJurisdictions[t] = client.types[t].states.slice(); }
          refreshAutoMessage(f, client);
          render();
        }}),
        el("span",{},[ TYPE_LABELS[t] ])
      ]);
    });

    return el("div",{class:"card section"},[
      el("div",{class:"section-head"},[ el("h2",{},["Client & deliverable"]) ]),
      el("div",{class:"grid3"},[
        el("div",{class:"field"},[ el("label",{},["Client ", el("span",{class:"req"},["*"])]), clientSelect,
          client ? el("span",{class:"help-text"},[client.platform + " · account " + client.ref]) : null
        ]),
        el("div",{class:"field"},[ el("label",{},["Included in this delivery ", el("span",{class:"req"},["*"])]),
          client ? el("div",{class:"type-check-row"}, typeButtons) : el("span",{class:"help-text"},["Choose a client first"])
        ]),
        el("div",{class:"field"},[ el("label",{},["Reporting period ", el("span",{class:"req"},["*"])]),
          el("input",{class:"input", type:"month", value:f.period, onchange:function(e){ f.period = e.target.value; refreshAutoMessage(f, client); render(); }})
        ])
      ])
    ]);
  }

  function renderJurisdictionSection(f, client){
    var keys = includedTypeKeys(f);
    if(!keys.length){
      return el("div",{class:"card section"},[ el("p",{class:"empty-note"},["Select at least one deliverable type above to choose jurisdictions."]) ]);
    }
    return el("div",{class:"card section"},[
      el("div",{class:"chiprow-head"},[
        el("h2",{style:"font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:700;"},["Jurisdictions"]),
        el("span",{class:"chip-count"},[totalJurisdictionCount(f) + " states total"])
      ]),
      el("div",{}, keys.map(function(t){
        var allStates = client.types[t].states;
        var sel = f.typeJurisdictions[t] || [];
        return el("div",{class:"type-block"},[
          el("div",{class:"type-block-head"},[
            el("span",{class:"type-block-title"},[TYPE_LABELS[t]]),
            el("span",{class:"chip-count"},[sel.length + " of " + allStates.length])
          ]),
          el("div",{class:"chiprow"}, allStates.map(function(st){
            var checked = sel.indexOf(st) !== -1;
            return el("label",{class:"chip-check"},[
              el("input",{type:"checkbox", checked:checked, onchange:function(){
                var idx = sel.indexOf(st);
                if(idx === -1){ sel.push(st); } else { sel.splice(idx,1); }
                f.typeJurisdictions[t] = sel;
                render();
              }}),
              el("span",{},[st])
            ]);
          })),
          el("div",{style:"margin-top:6px;"},[
            el("button",{class:"link-btn", onclick:function(){ f.typeJurisdictions[t] = allStates.slice(); render(); }},["Select all"]),
            el("span",{},[" · "]),
            el("button",{class:"link-btn", onclick:function(){ f.typeJurisdictions[t] = []; render(); }},["Clear"])
          ])
        ]);
      }))
    ]);
  }

  function renderPreviewSection(f, client){
    var keys = includedTypeKeys(f);
    var sections = keys.map(function(t){
      var allStates = client.types[t].states;
      var sel = f.typeJurisdictions[t] || [];
      return el("div",{},[
        el("div",{class:"preview-section-title"},[TYPE_LABELS[t]]),
        el("div",{class:"preview-chips"}, allStates.map(function(st){
          return el("span",{class:"preview-chip" + (sel.indexOf(st)!==-1 ? " on" : "")},[st]);
        }))
      ]);
    });
    return el("div",{class:"card section"},[
      el("div",{class:"section-head"},[ el("h2",{},["Deliverable preview"]), el("span",{class:"hint"},["Screenshot this to include in the email — matches your current process"]) ]),
      el("div",{class:"preview-card"},[
        el("div",{class:"preview-toolbar"},[ el("span",{},["PREVIEW"]) ]),
        el("div",{class:"preview-inner"},[
          el("div",{class:"preview-title"},["Token of Trust Reporting Deliverable"]),
          el("div",{class:"preview-meta"},[
            el("div",{},[ el("div",{class:"k"},["Customer"]), el("div",{class:"v"},[client.domain]) ]),
            el("div",{},[ el("div",{class:"k"},["Period"]), el("div",{class:"v"},[fmtPeriod(f.period)]) ]),
            el("div",{},[ el("div",{class:"k"},["States"]), el("div",{class:"v"},[String(totalJurisdictionCount(f))]) ])
          ]),
          el("div",{}, sections.length ? sections : [el("p",{class:"empty-note"},["Nothing selected yet."])])
        ])
      ]),
      el("div",{class:"field", style:"margin-top:16px;"},[
        el("div",{style:"display:flex; align-items:baseline; justify-content:space-between;"},[
          el("label",{},["Message ", el("span",{class:"req"},["*"])]),
          el("button",{class:"link-btn", type:"button", onclick:function(e){ copyText(f.message, e.currentTarget); }},[ f.copyFeedback === "ok" ? "Copied ✓" : f.copyFeedback === "fail" ? "Couldn't copy — select & copy manually" : "Copy message" ])
        ]),
        el("textarea",{class:"input", rows:5, oninput:function(e){ f.message = e.target.value; render(); }},[f.message])
      ])
    ]);
  }

  function renderAttachmentSection(f){
    var list = el("div",{class:"attach-list"}, f.attachments.map(function(a, i){
      return el("div",{class:"attach-item"},[
        el("div",{class:"ic"},["📎"]),
        el("div",{class:"meta"},[
          el("span",{class:"name"},[a.name]),
          a.link ? el("span",{class:"link"},[a.link]) : null
        ]),
        el("button",{"aria-label":"Remove attachment", onclick:function(){ f.attachments.splice(i,1); render(); }},["×"])
      ]);
    }));
    if(f.attachments.length === 0){
      list.appendChild(el("p",{class:"empty-note"},["No additional files."]));
    }
    return el("div",{class:"card section"},[
      el("div",{class:"section-head"},[ el("h2",{},["Additional files"]), el("span",{class:"hint"},["Optional — e.g. a separate PDF export"]) ]),
      list,
      el("div",{class:"attach-add"},[
        el("input",{class:"input", placeholder:"File name (e.g. Client_PACT-PA2_Aug2026.pdf)", value:f.attachName, oninput:function(e){ f.attachName = e.target.value; }}),
        el("input",{class:"input", placeholder:"Drive / source link (optional)", value:f.attachLink, oninput:function(e){ f.attachLink = e.target.value; }}),
        el("button",{class:"btn", type:"button", onclick:function(){
          var nameInput = f.attachName.trim();
          if(!nameInput) return;
          f.attachments.push({ name:nameInput, link:f.attachLink.trim() });
          f.attachName = ""; f.attachLink = "";
          render();
        }},["Add file"])
      ])
    ]);
  }

  function renderRecipientSection(f){
    var emails = parseEmails(f.recipientEmails);
    var invalid = emails.filter(function(e){ return !validEmail(e); });
    return el("div",{class:"card section"},[
      el("div",{class:"section-head"},[ el("h2",{},["Recipient"]) ]),
      el("div",{class:"grid2"},[
        el("div",{class:"field"},[ el("label",{},["Contact name ", el("span",{class:"req"},["*"])]),
          el("input",{class:"input", placeholder:"e.g. Streamline Vape — Compliance", value:f.recipientName, oninput:function(e){ f.recipientName = e.target.value; render(); }})
        ]),
        el("div",{class:"field"},[ el("label",{},["Email address(es) ", el("span",{class:"req"},["*"])]),
          el("input",{class:"input", placeholder:"name@client.com, name2@client.com", value:f.recipientEmails, oninput:function(e){ f.recipientEmails = e.target.value; render(); }}),
          (f.touched && invalid.length > 0) ? el("span",{class:"error-text"},["Not a valid email: " + invalid.join(", ")]) : el("span",{class:"help-text"},["Separate multiple addresses with commas"])
        ])
      ])
    ]);
  }

  function validate(f, forSend){
    var errors = [];
    if(!f.clientId) errors.push("Select a client");
    if(!f.period) errors.push("Set a reporting period");
    var keys = includedTypeKeys(f);
    if(keys.length === 0) errors.push("Include at least one deliverable type");
    if(forSend){
      if(totalJurisdictionCount(f) === 0) errors.push("Select at least one jurisdiction");
      if(!f.message.trim()) errors.push("Write a message");
      if(!f.recipientName.trim()) errors.push("Add a recipient name");
      var emails = parseEmails(f.recipientEmails);
      if(emails.length === 0) errors.push("Add at least one recipient email");
      else if(emails.some(function(e){ return !validEmail(e); })) errors.push("Fix the invalid recipient email");
    }
    return errors;
  }

  function renderSendFooter(f, baseErrors){
    var sendErrors = validate(f, true);
    var canSaveDraft = baseErrors.length === 0 && !VIEW.readOnly;
    var canSend = sendErrors.length === 0 && !VIEW.readOnly;

    return el("div",{class:"send-footer"},[
      el("div",{class: "issues" + (canSend ? " ok" : "")},[
        canSend ? "Ready to send." : (sendErrors[0] ? ("Before sending: " + sendErrors[0] + (sendErrors.length>1 ? " (+" + (sendErrors.length-1) + " more)" : "") ) : "")
      ]),
      el("div",{class:"actions"},[
        el("button",{class:"btn btn-ghost", type:"button", onclick:function(){ VIEW.form = blankForm(); render(); }},["Clear form"]),
        el("button",{class:"btn", type:"button", disabled: !canSaveDraft || VIEW.saving, onclick:function(){ saveDraft(f); }},["Save draft"]),
        el("button",{class:"btn btn-primary", type:"button", disabled: !canSend || VIEW.saving, onclick:function(){
          f.touched = true;
          var errs = validate(f, true);
          if(errs.length){ render(); return; }
          openConfirm(f);
        }},[ VIEW.saving ? "Saving…" : "Review & send" ])
      ])
    ]);
  }

  function saveDraft(f){
    var next = cloneState();
    var record = formToRecord(f, "draft");
    upsertDeliverable(next, record, f.editingId);
    VIEW.form = blankForm();
    VIEW.tab = "tracker";
    persist(next, { type:"good", text:"Draft saved for " + clientById(record.clientId).domain + " — " + fmtPeriod(record.period) + "." }, record);
  }

  function formToRecord(f, status){
    return {
      id: f.editingId || uid(),
      clientId: f.clientId,
      clientDomain: clientById(f.clientId) ? clientById(f.clientId).domain : f.clientId,
      period: f.period,
      items: includedTypeKeys(f).map(function(t){ return { type:t, jurisdictions:(f.typeJurisdictions[t]||[]).slice() }; }),
      jurisdictions: includedTypeKeys(f).reduce(function(acc,t){ return acc.concat(f.typeJurisdictions[t]||[]); }, []),
      type: includedTypeKeys(f).map(function(t){return TYPE_LABELS[t];}).join(", "),
      message: f.message,
      attachments: f.attachments.slice(),
      files: f.attachments.map(function(a){return a.name;}).join(", "),
      recipient: { name: f.recipientName.trim(), emails: parseEmails(f.recipientEmails) },
      status: status,
      sentAt: status === "sent" ? new Date().toISOString() : "",
      sentBy: status === "sent" ? "Marc Guico" : "",
      note: ""
    };
  }

  function upsertDeliverable(state, record, editingId){
    if(editingId){
      var idx = -1;
      for(var i=0;i<state.deliverables.length;i++){ if(state.deliverables[i].id === editingId){ idx = i; break; } }
      if(idx !== -1){ state.deliverables[idx] = record; return; }
    }
    state.deliverables.unshift(record);
  }

  function cloneState(){
    return JSON.parse(JSON.stringify(STATE));
  }

  function openConfirm(f){
    var client = clientById(f.clientId);
    var existingSent = STATE.deliverables.find(function(d){
      return d.clientId === f.clientId && d.period === f.period && d.status === "sent" && d.id !== f.editingId;
    });
    VIEW.confirmModal = { f: f, client: client, duplicate: existingSent || null, freescoutDraft: VIEW.freescoutEnabled };
    render();
  }

  function renderConfirmModal(){
    var m = VIEW.confirmModal;
    var f = m.f, client = m.client;
    var rows = [
      ["Client", client.domain],
      ["Included", includedTypeKeys(f).map(function(t){return TYPE_LABELS[t];}).join(", ")],
      ["Period", fmtPeriod(f.period)],
      ["Jurisdictions", totalJurisdictionCount(f) + " states"],
      ["Recipient", f.recipientName + " — " + parseEmails(f.recipientEmails).join(", ")]
    ];
    var body = [ el("div",{class:"modal-body"}, rows.map(function(r){
      return el("div",{class:"modal-row"},[ el("span",{class:"k"},[r[0]]), el("span",{class:"v"},[r[1]]) ]);
    })) ];
    if(m.duplicate){
      body.push(el("div",{class:"modal-body", style:"padding-top:0;"},[
        el("p",{class:"modal-note"},["This client already has a deliverable marked sent for " + fmtPeriod(m.duplicate.period) + " on " + fmtDateTime(m.duplicate.sentAt) + ". Sending again will log a second entry."])
      ]));
    }
    if(VIEW.freescoutEnabled){
      body.push(el("div",{class:"modal-body", style:"padding-top:0;"},[
        el("label",{class:"type-check", style:"display:flex; width:100%;"},[
          el("input",{type:"checkbox", checked: m.freescoutDraft, onchange:function(e){ m.freescoutDraft = e.target.checked; }}),
          el("span",{style:"width:100%; text-align:left;"},["Also create a draft reply in FreeScout (won't send — you review and hit send there)"])
        ])
      ]));
    }
    return el("div",{class:"overlay", onclick:function(e){ if(e.target === e.currentTarget){ VIEW.confirmModal = null; render(); } }},[
      el("div",{class:"modal"},[
        el("div",{class:"modal-head"},[ el("h3",{},[ m.duplicate ? "Send again?" : "Confirm & send" ]) ]),
        el("div",{},body),
        el("div",{class:"modal-foot"},[
          el("button",{class:"btn btn-ghost", onclick:function(){ VIEW.confirmModal = null; render(); }},["Cancel"]),
          el("button",{class:"btn btn-primary", onclick:function(){ confirmSend(f, !!m.duplicate, !!m.freescoutDraft); }},[ m.duplicate ? "Send anyway" : "Confirm & send" ])
        ])
      ])
    ]);
  }

  function confirmSend(f, isDuplicate, wantFreescout){
    var next = cloneState();
    var record = formToRecord(f, "sent");
    if(isDuplicate){ next.deliverables.unshift(record); }
    else { upsertDeliverable(next, record, f.editingId); }
    VIEW.confirmModal = null;
    VIEW.form = blankForm();
    VIEW.tab = "tracker";
    var toast = { type:"good", text:"Logged as sent to " + record.recipient.emails.join(", ") + "." };
    if(!wantFreescout){
      toast.text += " Don't forget to actually send the email with a screenshot of the preview.";
    }
    persist(next, toast, record);
    if(wantFreescout && SETTINGS.url && SETTINGS.token){
      draftToFreeScout(record).then(function(res){
        if(res && res.ok){
          VIEW.banner = { type:"good", text:"Logged as sent, and a draft reply is waiting in FreeScout for " + record.recipient.emails.join(", ") + " — review it there before it goes out." };
        } else {
          VIEW.banner = { type:"bad", text:"Logged as sent, but the FreeScout draft failed" + (res && res.error ? (": " + res.error) : "") + ". You'll need to create that reply by hand." };
        }
        render();
      }).catch(function(err){
        VIEW.banner = { type:"bad", text:"Logged as sent, but couldn't reach FreeScout (" + err.message + "). You'll need to create that reply by hand." };
        render();
      });
    }
  }

  /* ---------------- tracker tab ---------------- */

  function renderTrackerTab(){
    var wrap = el("div",{},[]);
    wrap.appendChild(renderStats());
    wrap.appendChild(renderFilters());
    wrap.appendChild(renderTable());
    return wrap;
  }

  function renderStats(){
    var total = STATE.deliverables.length;
    var sent = STATE.deliverables.filter(function(d){return d.status==="sent";}).length;
    var draft = STATE.deliverables.filter(function(d){return d.status==="draft";}).length;
    var failed = STATE.deliverables.filter(function(d){return d.status==="failed";}).length;
    function tile(num, lbl, attn){
      return el("div",{class:"stat" + (attn?" attn":"")},[ el("div",{class:"mono num"},[String(num)]), el("div",{class:"lbl"},[lbl]) ]);
    }
    return el("div",{class:"stat-grid"},[
      tile(total, "Total deliverables"),
      tile(sent, "Sent"),
      tile(draft, "In draft"),
      tile(failed, "Needs attention", failed>0)
    ]);
  }

  function renderFilters(){
    var statuses = ["all","draft","sent","failed"];
    return el("div",{class:"filters"},[
      el("div",{class:"pillset"}, statuses.map(function(s){
        return el("button",{class:"pill-filter", "aria-pressed": VIEW.filterStatus===s, onclick:function(){ VIEW.filterStatus = s; render(); }},[ s==="all" ? "All" : STATUS_LABELS[s] ]);
      })),
      el("select",{class:"select", style:"width:auto;min-width:170px;", onchange:function(e){ VIEW.filterClient = e.target.value; render(); }}, [el("option",{value:""},["All clients"])].concat(STATE.clients.map(function(c){
        var o = el("option",{value:c.id},[c.domain]);
        if(c.id===VIEW.filterClient) o.selected = true;
        return o;
      }))),
      el("input",{class:"input search", placeholder:"Search client…", value:VIEW.search, oninput:function(e){ VIEW.search = e.target.value; render(); }}),
      el("button",{class:"btn btn-primary btn-sm", style:"margin-left:auto;", onclick:function(){ VIEW.form = blankForm(); VIEW.tab = "send"; render(); }},["+ New deliverable"])
    ]);
  }

  function filteredDeliverables(){
    return STATE.deliverables.filter(function(d){
      if(VIEW.filterStatus !== "all" && d.status !== VIEW.filterStatus) return false;
      if(VIEW.filterClient && d.clientId !== VIEW.filterClient) return false;
      if(VIEW.search){
        var c = clientById(d.clientId);
        var domain = (c ? c.domain : (d.clientDomain||"")).toLowerCase();
        if(domain.indexOf(VIEW.search.toLowerCase()) === -1) return false;
      }
      return true;
    }).sort(function(a,b){
      var ap = a.sentAt || "9999", bp = b.sentAt || "9999";
      if(a.period !== b.period) return a.period < b.period ? 1 : -1;
      return ap < bp ? 1 : -1;
    });
  }

  function jurisdictionCount(d){
    if(d.items && d.items.length){ return d.items.reduce(function(n,it){ return n + (it.jurisdictions||[]).length; }, 0); }
    return (d.jurisdictions||[]).length;
  }

  function typesLabel(d){
    if(d.items && d.items.length){ return d.items.map(function(it){ return TYPE_LABELS[it.type] || it.type; }).join(", "); }
    return d.type || "—";
  }

  function renderTable(){
    var rows = filteredDeliverables();
    if(rows.length === 0){
      return el("div",{class:"table-wrap"},[ el("div",{class:"empty-state"},[ el("div",{class:"big"},["🗂️"]), el("p",{},["No deliverables match these filters."]) ]) ]);
    }
    var body = el("tbody",{}, rows.map(function(d){
      var c = clientById(d.clientId);
      return el("tr",{},[
        el("td",{},[ el("button",{class:"row-btn", onclick:function(){ VIEW.detailModal = d; render(); }},[
          el("span",{class:"row-client"},[c ? c.domain : d.clientDomain]),
          el("span",{class:"row-sub"},[c ? c.platform : ""])
        ]) ]),
        el("td",{},[typesLabel(d)]),
        el("td",{class:"mono"},[fmtPeriod(d.period)]),
        el("td",{class:"mono"},[String(jurisdictionCount(d))]),
        el("td",{},[ (d.recipient && d.recipient.emails && d.recipient.emails.length) ? d.recipient.emails.join(", ") : "—" ]),
        el("td",{},[ el("span",{class:"pill pill-" + d.status},[STATUS_LABELS[d.status] || d.status]) ]),
        el("td",{class:"mono"},[ d.sentAt ? fmtDateTime(d.sentAt) : "—" ])
      ]);
    }));
    return el("div",{class:"table-wrap"},[
      el("table",{},[
        el("thead",{},[ el("tr",{}, ["Client","Included","Period","States","Recipient","Status","Sent"].map(function(h){ return el("th",{},[h]); })) ]),
        body
      ])
    ]);
  }

  function renderDetailModal(){
    var d = VIEW.detailModal;
    var c = clientById(d.clientId);
    var rows = [
      ["Client", c ? c.domain : (d.clientDomain||d.clientId)],
      ["Included", typesLabel(d)],
      ["Period", fmtPeriod(d.period)],
      ["Jurisdictions", String(jurisdictionCount(d))],
      ["Recipient", ((d.recipient&&d.recipient.name) || "—") + ((d.recipient&&d.recipient.emails&&d.recipient.emails.length) ? " — " + d.recipient.emails.join(", ") : "")],
      ["Status", STATUS_LABELS[d.status] || d.status],
      ["Sent", d.sentAt ? (fmtDateTime(d.sentAt) + " by " + d.sentBy) : "Not sent yet"]
    ];
    var body = [ el("div",{class:"modal-body"}, rows.map(function(r){
      return el("div",{class:"modal-row"},[ el("span",{class:"k"},[r[0]]), el("span",{class:"v"},[r[1]]) ]);
    })) ];
    if(d.message){
      body.push(el("div",{class:"modal-body", style:"padding-top:0;"},[ el("p",{class:"modal-note"},[d.message]) ]));
    }
    if(d.status === "failed" && d.note){
      body.push(el("div",{class:"modal-body", style:"padding-top:0;"},[ el("p",{class:"modal-note"},[d.note]) ]));
    }
    var actions = [ el("button",{class:"btn btn-ghost", onclick:function(){ VIEW.detailModal = null; render(); }},["Close"]) ];
    if(!VIEW.readOnly && (d.status === "draft" || d.status === "failed")){
      actions.push(el("button",{class:"btn btn-primary", onclick:function(){
        VIEW.form = recordToForm(d);
        VIEW.detailModal = null;
        VIEW.tab = "send";
        render();
      }},[ d.status === "failed" ? "Retry in Send form" : "Continue editing" ]));
    }
    return el("div",{class:"overlay", onclick:function(e){ if(e.target === e.currentTarget){ VIEW.detailModal = null; render(); } }},[
      el("div",{class:"modal"},[
        el("div",{class:"modal-head"},[ el("h3",{},[ c ? c.domain : "Deliverable" ]) ]),
        el("div",{},body),
        el("div",{class:"modal-foot"}, actions)
      ])
    ]);
  }

  function recordToForm(d){
    var f = blankForm();
    f.editingId = d.id;
    f.clientId = d.clientId;
    f.period = d.period;
    f.selectedTypes = {};
    f.typeJurisdictions = {};
    (d.items || []).forEach(function(it){ f.selectedTypes[it.type] = true; f.typeJurisdictions[it.type] = (it.jurisdictions||[]).slice(); });
    f.message = d.message || "";
    f.messageAuto = "";
    f.attachments = (d.attachments || []).slice();
    f.recipientName = (d.recipient && d.recipient.name) || "";
    f.recipientEmails = (d.recipient && d.recipient.emails) ? d.recipient.emails.join(", ") : "";
    return f;
  }

  render();

  if(!HAS_RUNTIME && SETTINGS.url){ syncFromSheets(false); }
})();
</script>

</body>
</html>
